<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0a7d5a"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="358" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">Where your paper goes</text>

  <!-- Your computer -->
  <rect x="30" y="70" width="570" height="260" rx="16" fill="#e8f4ee" stroke="#0a7d5a" stroke-width="2"/>
  <text x="50" y="100" font-size="13" font-weight="700" fill="#0a7d5a" letter-spacing="1.5">YOUR COMPUTER</text>

  <!-- three boxes -->
  <g font-size="15" text-anchor="middle" fill="#111827">
    <rect x="50" y="120" width="150" height="96" rx="12" fill="#ffffff" stroke="#9ccfb8"/>
    <!-- document icon -->
    <path d="M113,134 h18 l8,8 v24 h-26 z" fill="#ffffff" stroke="#0a7d5a" stroke-width="2"/>
    <line x1="118" y1="150" x2="134" y2="150" stroke="#0a7d5a" stroke-width="2"/>
    <line x1="118" y1="157" x2="134" y2="157" stroke="#0a7d5a" stroke-width="2"/>
    <text x="125" y="190" font-weight="700">Your paper</text>
    <text x="125" y="207" font-size="13" fill="#4b5563">the PDF</text>

    <rect x="240" y="120" width="150" height="96" rx="12" fill="#ffffff" stroke="#9ccfb8"/>
    <!-- chip icon -->
    <rect x="302" y="136" width="26" height="26" rx="4" fill="none" stroke="#0a7d5a" stroke-width="2"/>
    <rect x="310" y="144" width="10" height="10" fill="#0a7d5a"/>
    <text x="315" y="190" font-weight="700">AI model</text>
    <text x="315" y="207" font-size="13" fill="#4b5563">runs right here</text>

    <rect x="430" y="120" width="150" height="96" rx="12" fill="#ffffff" stroke="#9ccfb8"/>
    <!-- flag icon -->
    <line x1="497" y1="134" x2="497" y2="166" stroke="#0a7d5a" stroke-width="2.5"/>
    <path d="M497,135 h20 l-5,7 l5,7 h-20 z" fill="#0a7d5a"/>
    <text x="505" y="190" font-weight="700">Flags for you</text>
    <text x="505" y="207" font-size="13" fill="#4b5563">to check yourself</text>
  </g>
  <line x1="202" y1="168" x2="236" y2="168" stroke="#0a7d5a" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="392" y1="168" x2="426" y2="168" stroke="#0a7d5a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- lock line -->
  <g transform="translate(60,262)">
    <rect x="0" y="10" width="22" height="18" rx="3" fill="#0a7d5a"/>
    <path d="M5,10 v-5 a6,6 0 0 1 12,0 v5" fill="none" stroke="#0a7d5a" stroke-width="2.5"/>
  </g>
  <text x="94" y="286" font-size="16" font-weight="700" fill="#065f46">The paper and its full text never leave this box.</text>
  <text x="94" y="308" font-size="13" fill="#065f46">No cloud AI. Chats and notes are saved on this computer too.</text>

  <!-- internet -->
  <line x1="604" y1="168" x2="664" y2="168" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrg)"/>
  <g fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5">
    <ellipse cx="760" cy="172" rx="78" ry="30"/>
    <circle cx="730" cy="152" r="24"/>
    <circle cx="775" cy="144" r="30"/>
  </g>
  <ellipse cx="760" cy="172" rx="76" ry="28" fill="#f3f4f6"/>
  <circle cx="730" cy="153" r="22" fill="#f3f4f6"/>
  <circle cx="775" cy="145" r="28" fill="#f3f4f6"/>
  <text x="760" y="170" font-size="16" font-weight="700" text-anchor="middle" fill="#374151">Internet</text>

  <g font-size="13" fill="#4b5563" text-anchor="middle">
    <text x="760" y="232" font-weight="700" fill="#374151">Optional, and only if you use it:</text>
    <text x="760" y="252">short search phrases from</text>
    <text x="760" y="270">the search features you click</text>
    <text x="760" y="288">(never the paper itself)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
