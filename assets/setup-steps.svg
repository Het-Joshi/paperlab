<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 286" width="880" height="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <rect x="1" y="1" width="878" height="284" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">Getting started</text>

  <g transform="translate(0,16)">
  <!-- brackets -->
  <path d="M60,78 v-8 h580 v8" fill="none" stroke="#0a7d5a" stroke-width="2"/>
  <text x="350" y="64" font-size="13" font-weight="700" fill="#0a7d5a" text-anchor="middle" letter-spacing="1.5">ONCE</text>
  <path d="M680,78 v-8 h160 v8" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text x="760" y="64" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="1.5">EVERY TIME</text>

  <!-- connector -->
  <line x1="130" y1="130" x2="760" y2="130" stroke="#d1d5db" stroke-width="4"/>

  <g text-anchor="middle">
    <!-- step 1 -->
    <circle cx="130" cy="130" r="34" fill="#0a7d5a"/>
    <text x="130" y="141" font-size="30" font-weight="700" fill="#ffffff">1</text>
    <text x="130" y="194" font-size="16" font-weight="700" fill="#111827">Download</text>
    <text x="130" y="214" font-size="13" fill="#4b5563">the ZIP from GitHub</text>
    <text x="130" y="232" font-size="13" fill="#4b5563">and unzip it</text>

    <!-- step 2 -->
    <circle cx="340" cy="130" r="34" fill="#0a7d5a"/>
    <text x="340" y="141" font-size="30" font-weight="700" fill="#ffffff">2</text>
    <text x="340" y="194" font-size="16" font-weight="700" fill="#111827">Open Terminal</text>
    <text x="340" y="214" font-size="13" fill="#4b5563">and point it at</text>
    <text x="340" y="232" font-size="13" fill="#4b5563">the paperlab folder</text>

    <!-- step 3 -->
    <circle cx="550" cy="130" r="34" fill="#0a7d5a"/>
    <text x="550" y="141" font-size="30" font-weight="700" fill="#ffffff">3</text>
    <text x="550" y="194" font-size="16" font-weight="700" fill="#111827">Install</text>
    <text x="550" y="214" font-size="13" fill="#4b5563">paste one command,</text>
    <text x="550" y="232" font-size="13" fill="#4b5563">wait for the download</text>

    <!-- step 4 -->
    <circle cx="760" cy="130" r="34" fill="#2563eb"/>
    <text x="760" y="141" font-size="30" font-weight="700" fill="#ffffff">4</text>
    <text x="760" y="194" font-size="16" font-weight="700" fill="#111827">Start &amp; open</text>
    <text x="760" y="214" font-size="13" fill="#4b5563">paste three commands,</text>
    <text x="760" y="232" font-size="13" fill="#4b5563">use it in your browser</text>
  </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
