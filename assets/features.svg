<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="428" rx="18" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="46" font-size="22" font-weight="700" fill="#111827">What it does</text>
  <text x="40" y="70" font-size="14" fill="#4b5563">Four reviewer viewpoints read the paper. Each one quotes the passage it is flagging.</text>

  <!-- persona cards -->
  <g text-anchor="middle">
    <rect x="30" y="88" width="190" height="112" rx="12" fill="#ecfdf5" stroke="#0a7d5a"/>
    <rect x="30" y="88" width="190" height="8" rx="4" fill="#0a7d5a"/>
    <text x="125" y="128" font-size="17" font-weight="700" fill="#065f46">Methods</text>
    <text x="125" y="154" font-size="13" fill="#374151">Weak design, bias,</text>
    <text x="125" y="172" font-size="13" fill="#374151">hidden confounders</text>

    <rect x="240" y="88" width="190" height="112" rx="12" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="240" y="88" width="190" height="8" rx="4" fill="#2563eb"/>
    <text x="335" y="128" font-size="17" font-weight="700" fill="#1e40af">Ethics</text>
    <text x="335" y="154" font-size="13" fill="#374151">Ethics approval, consent,</text>
    <text x="335" y="172" font-size="13" fill="#374151">personal data, harm</text>

    <rect x="450" y="88" width="190" height="112" rx="12" fill="#fffbeb" stroke="#b45309"/>
    <rect x="450" y="88" width="190" height="8" rx="4" fill="#b45309"/>
    <text x="545" y="128" font-size="17" font-weight="700" fill="#92400e">Novelty</text>
    <text x="545" y="154" font-size="13" fill="#374151">What is truly new,</text>
    <text x="545" y="172" font-size="13" fill="#374151">compared with past work</text>

    <rect x="660" y="88" width="190" height="112" rx="12" fill="#f5f3ff" stroke="#7c3aed"/>
    <rect x="660" y="88" width="190" height="8" rx="4" fill="#7c3aed"/>
    <text x="755" y="128" font-size="17" font-weight="700" fill="#5b21b6">Scope</text>
    <text x="755" y="154" font-size="13" fill="#374151">The main point in one</text>
    <text x="755" y="172" font-size="13" fill="#374151">sentence; what to cut</text>
  </g>

  <!-- extra tools -->
  <text x="40" y="236" font-size="14" font-weight="700" fill="#111827">Plus</text>
  <g text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">
    <rect x="30" y="248" width="190" height="44" rx="22" fill="#f3f4f6"/>
    <text x="125" y="275">Overall recommendation</text>
    <rect x="240" y="248" width="190" height="44" rx="22" fill="#f3f4f6"/>
    <text x="335" y="275">Fact-check claims</text>
    <rect x="450" y="248" width="190" height="44" rx="22" fill="#f3f4f6"/>
    <text x="545" y="275">Chat about the paper</text>
    <rect x="660" y="248" width="190" height="44" rx="22" fill="#f3f4f6"/>
    <text x="755" y="275">Search papers &amp; web</text>
  </g>

  <!-- you stay in charge -->
  <line x1="30" y1="318" x2="850" y2="318" stroke="#e5e7eb" stroke-width="2"/>
  <text x="40" y="346" font-size="14" font-weight="700" fill="#111827">You stay in charge</text>
  <g text-anchor="middle" font-size="14" font-weight="600">
    <rect x="30" y="360" width="180" height="46" rx="10" fill="#111827"/>
    <text x="120" y="388" fill="#ffffff">You read the paper</text>
    <rect x="240" y="360" width="180" height="46" rx="10" fill="#e8f4ee" stroke="#0a7d5a"/>
    <text x="330" y="388" fill="#065f46">paperlab raises flags</text>
    <rect x="450" y="360" width="180" height="46" rx="10" fill="#111827"/>
    <text x="540" y="388" fill="#ffffff">You check each flag</text>
    <rect x="660" y="360" width="190" height="46" rx="10" fill="#111827"/>
    <text x="755" y="388" fill="#ffffff">You make the call</text>
  </g>
  <g stroke="#374151" stroke-width="2.5" marker-end="url(#a)">
    <line x1="212" y1="383" x2="236" y2="383"/>
    <line x1="422" y1="383" x2="446" y2="383"/>
    <line x1="632" y1="383" x2="656" y2="383"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
